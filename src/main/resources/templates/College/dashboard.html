<!DOCTYPE html>
<html lang="en" th:replace="~{parent :: index(~{::#content}, ~{::title})}">
<head>
<meta charset="UTF-8">
<title>College Dashboard</title>
</head>

<body>
<div id="content">


<div class="main">

    <div class="cards">

        <div class="card">
            <h2>[[${totalStudent}]]</h2>
            <p>Total Students</p>
        </div>

        <div class="card">
            <h2>[[${totalDepartment}]]</h2>
            <p>Total Department</p>
        </div>

        <div class="card">
            <h2>[[${totalTeacher}]]</h2>
            <p>Teachers</p>
        </div>

        <div class="card">
            <h2>[[${todayLectures}]]</h2>
            <p>Lectures Today</p>
        </div>

    </div>

    <div class="table-section">

        <h3>Recent Attendance</h3>

        <div class="table-box">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Roll No</th>
                        <th>Class</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>Rahul Patil</td>
                        <td>101</td>
                        <td>FY</td>
                        <td class="present">Present</td>
                    </tr>

                    <tr>
                        <td>Amit Sharma</td>
                        <td>102</td>
                        <td>SY</td>
                        <td class="absent">Absent</td>
                    </tr>

                </tbody>
            </table>
        </div>

    </div>

</div>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial;
}

.main {
    margin-left: 180px;
    margin-top: 20px;
    padding: 20px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

.table-section {
    background: white;
    padding: 20px;
    border-radius: 10px;
}

.table-box {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

thead {
    background: #1668ec;
    color: white;
}

th, td {
    padding: 12px;
    text-align: center;
}

.present {
    color: green;
}

.absent {
    color: red;
}

@media(max-width: 768px) {
    .cards {
        grid-template-columns: repeat(2, 1fr);
    }

    .main {
        margin-left: 0;
    }

    .sidebar {
        display: none;
    }
}
</style>

</div>
</body>
</html>
