<!DOCTYPE html>
<html lang="en" th:replace="~{parent :: index(~{::#content},~{::title})}">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password | SmartScan AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
<div id="content">

    <section class="login-section">
        <div class="login-card">

            <h2>Reset Your <span>Password</span></h2>
            <p class="login-subtext">Verify your college details</p>

            <th:block th:if="${session.successMsg}">
                <p class="custom-text-success">[[${session.successMsg}]]</p>
                <th:block th:text="${@commonService.removeMessage()}"></th:block>
            </th:block>

            <th:block th:if="${session.errorMsg}">
                <p class="custom-text-error">[[${session.errorMsg}]]</p>
                <th:block th:text="${@commonService.removeMessage()}"></th:block>
            </th:block>

            <form th:action="@{/do-college-forgot-password}" method="post" novalidate>

                <div class="input-box">
                    <label>College ID</label>
                    <input type="text" name="collegeId" placeholder="Enter College ID" required>
                </div>

                <div class="input-box">
                    <label>College Name</label>
                    <input type="text" name="collegeName" placeholder="Enter College Name" required>
                </div>

                <div class="input-box">
                    <label>College Email</label>
                    <input type="email" name="collegeEmail" placeholder="Enter Registered Email" required>
                </div>

                <button type="submit" class="copilot-btn">
                    <i class="fas fa-key"></i> Verify & Reset
                </button>
            </form>

            <div class="login-links">
                <p>Remember your password? <a th:href="@{/college-login}">Login</a></p>
            </div>

        </div>
    </section>

    <style>
        .custom-text-success {
            text-align: center;
            color: #16a34a;
            font-weight: 600;
            margin-top: 0.5rem;
        }

        .custom-text-error {
            text-align: center;
            color: #c20b0b;
            font-weight: 600;
            margin-top: 0.5rem;
        }

        .login-section {
            display: flex;
            justify-content: center;
            align-items: flex-start;  
            padding: 60px 20px;       
            min-height: calc(100vh - 200px); 
        }

        .login-card {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: fadeIn 0.6s ease-in-out;
        }

        .login-card h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .login-card span {
            color: #2563eb;
        }

        .login-subtext {
            text-align: center;
            font-size: 14px;
            color: gray;
            margin-bottom: 20px;
        }

        .input-box {
            margin-bottom: 15px;
        }

        .input-box label {
            font-weight: 500;
            display: block;
            margin-bottom: 5px;
        }

        .input-box input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            transition: 0.3s;
        }

        .input-box input:focus {
            border-color: #2563eb;
            outline: none;
            box-shadow: 0 0 5px rgba(37,99,235,0.4);
        }

        .copilot-btn {
            width: 100%;
            padding: 10px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        .copilot-btn:hover {
            background: #1e40af;
        }

        .login-links {
            margin-top: 15px;
            text-align: center;
        }

        .login-links a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
        }

        .login-links a:hover {
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>

</div>
</body>
</html>
