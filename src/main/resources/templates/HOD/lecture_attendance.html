<!DOCTYPE html>
<html lang="en" th:replace="~{parent :: index(~{::#content}, ~{::title})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="content">

        <div class="main-content">

            <h1>📊 <span>[[${subject}]]</span> Attendance Report</h1>

            <div class="cards">
                <div class="card">
                    <h3>[[${students.size()}]]</h3>
                    <p>Total Students</p>
                </div>
                <div class="card">
                    <h3>[[${todayPresent}]]</h3>
                    <p>Present Today</p>
                </div>
                <div class="card">
                    <h3>[[${attendancePercent}]]</h3>
                    <p>Attendance</p>
                </div>

            </div>

            <div class="topbar">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search student...">
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Sr No</th>
                            <th>Name</th>
                            <th>Roll No</th>
                            <th>Class</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="studentTableBody">
                        <tr th:each="std, s : ${students}">
                            <td>[[${s.count}]]</td>
                            <td>[[${std.name}]]</td>
                            <td>[[${std.rollNo}]]</td>
                            <td>[[${std.classroom}]]</td>
                            <td>
                                <th:block th:if="${std.status == 'PRESENT'}">
                                    <span class="status present">Present</span>
                                </th:block>
                                <th:block th:unless="${std.status == 'PRESENT'}">
                                    <span class="status absent">Absent</span>
                                </th:block>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <p id="noData" style="display:none; text-align:center; color:#dc2626; margin-top:15px;">
                    No student found
                </p>
            </div>

        </div>

        <script>
            document.getElementById("searchInput").addEventListener("keyup", function () {

                let filter = this.value.toLowerCase();
                let rows = document.querySelectorAll("table tbody tr");
                let visibleCount = 0;

                rows.forEach(row => {
                    let rowText = row.innerText.toLowerCase();

                    if (rowText.includes(filter)) {
                        row.style.display = "";
                        visibleCount++;
                    } else {
                        row.style.display = "none";
                    }
                });

                document.getElementById("noData").style.display =
                    visibleCount === 0 ? "block" : "none";
            });
        </script>

        <style>
            .main-content {
                margin-left: 180px;
                margin-top: 50px;
                padding: 25px;
                background: #f4f7fc;
                min-height: 100vh;
            }

            h1 {
                margin-bottom: 20px;
            }

            .cards {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 20px;
                margin-bottom: 20px;
            }

            .card {
                background: white;
                padding: 20px;
                border-radius: 10px;
                text-align: center;
                box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            }

            .card h3 {
                font-size: 26px;
                color: #1668ec;
            }

            .card p {
                color: #555;
            }

            .topbar {
                margin-bottom: 15px;
            }

            .search-box {
                position: relative;
                width: 300px;
            }

            .search-box i {
                position: absolute;
                left: 10px;
                top: 50%;
                transform: translateY(-50%);
                color: gray;
            }

            .search-box input {
                width: 100%;
                padding: 10px 10px 10px 35px;
                border-radius: 8px;
                border: 1px solid #ccc;
            }

            .table-container {
                background: white;
                border-radius: 10px;
                overflow: auto;
                max-height: 500px;
                box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            }

            table {
                width: 100%;
                border-collapse: collapse;
                min-width: 600px;
            }

            thead {
                position: sticky;
                top: 0;
                background: #1668ec;
                color: white;
            }

            th, td {
                padding: 12px;
                text-align: left;
                white-space: nowrap;
            }

            tbody tr:hover {
                background: #f5f8ff;
            }

            .status {
                padding: 5px 10px;
                border-radius: 15px;
                color: white;
                font-size: 13px;
            }

            .present {
                background: #28a745;
            }

            .absent {
                background: #dc2626;
            }
        </style>
    </div>
</body>
</html>
