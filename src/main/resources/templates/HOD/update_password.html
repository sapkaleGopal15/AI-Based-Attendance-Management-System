<!DOCTYPE html>
<html lang="en" th:replace="~{parent :: index(~{::#content}, ~{::title})}">
<head>
    <meta charset="UTF-8">
    <title>Department | Update Password</title>
</head>
<body>
<div id="content">

    <div th:if="${successMsg}"
        class="toast success"
        th:text="${successMsg}">
    </div>

    <div th:if="${errorMsg}"
        class="toast error"
        th:text="${errorMsg}">
    </div>

    <div class="register-wrapper">

        <div class="form-box">
            <h2>🏫 Update Password</h2>

            <form th:action="@{/hod/do-update-password}" method="post">

                <div class="input-group">
                    <label>Old Password</label>
                    <input type="password" name="oldPass" placeholder="Enter password" required>
                </div>

                <div class="input-group">
                    <label>New Password</label>
                    <input type="password" name="newPass" placeholder="Enter password" required>
                </div>

                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" name="conPass" placeholder="Confirm password" required>
                </div>

                <button type="submit" class="btn">Update</button>

            </form>
        </div>

    </div>



<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f7fb;
}

.register-wrapper {
    display: flex;
    justify-content: center;
    align-items: flex-start;   
    min-height: 100vh;
    padding-top: 30px;        
    padding-bottom: 50px;
    margin-left: 140px;
}

.form-box {
    width: 100%;
    max-width: 420px;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    animation: fadeIn 0.6s ease;
}

.form-box h2 {
    text-align: center;
    margin-bottom: 20px;
}

.input-group {
    margin-bottom: 15px;
}

.input-group label {
    font-size: 14px;
    margin-bottom: 5px;
    display: block;
}

.input-group input {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    transition: 0.3s;
}

.input-group input:focus {
    border-color: #1668ec;
    outline: none;
    box-shadow: 0 0 6px rgba(22,104,236,0.3);
}

.btn {
    width: 100%;
    padding: 12px;
    background: #1668ec;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

.btn:hover {
    background: #0f4fc4;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(40px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>

</div>
</body>
</html>
