<!DOCTYPE html>
<html lang="en" th:replace="~{parent :: index(~{::#content}, ~{::title})}">
<head>
    <meta charset="UTF-8">
    <title>HOD Dashboard</title>
</head>

<body>
<div id="content">
<div class="container">

    <div th:if="${successMsg}" class="toast success" th:text="${successMsg}"></div>

    <div th:if="${errorMsg}" class="toast error" th:text="${errorMsg}"></div>

    <div class="main">

        <div class="dashboard-header">
            <h2>Head of Department Dashboard</h2>
            <p>Manage teachers, students and department activities</p>
        </div>

        <div class="cards">
            <div class="card">
                <h3>[[${totalTeachers}]]</h3>
                <p>Total Teachers</p>
            </div>
            <div class="card">
                <h3>[[${totalStudents}]]</h3>
                <p>Total Students</p>
            </div>
            <div class="card">
                <h3>10</h3>
                <p>Total Classes</p>
            </div>
            <div class="card">
                <h3>[[${overallAttendance}]]%</h3>
                <p>Overall Attendance</p>
            </div>
        </div>

    </div>
</div>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6f9;
    margin-top: 50px;
}

.container {
    display: flex;
    margin-top: 20px;
}

.main {
    flex: 1;
    margin-left: 180px;
    padding: 25px;
}

.dashboard-header {
    background: linear-gradient(to right, #10b981, #059669);
    color: white;
    padding: 20px 25px;
    border-radius: 12px;
    margin-bottom: 20px;
}

.cards {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
}

.card {
    flex: 1;
    background: white;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.card h3 {
    font-size: 26px;
    color: #059669;
}

.table-section {
    background: white;
    padding: 20px;
    border-radius: 10px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

table th, table td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
}

.toast {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 12px 20px;
    color: white;
    border-radius: 6px;
}

.success { background: green; }
.error { background: red; }
</style>

</div>
</body>
</html>
