<!DOCTYPE html>
<html lang="en" th:replace="~{parent :: index(~{::#content}, ~{::title})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student | update</title>
</head>
<body>
    <div id="content">

        <div th:if="${successMsg}" class="toast success" id="toast" th:text="${successMsg}"></div>

        <div th:if="${errorMsg}" class="toast error" id="toast" th:text="${errorMsg}"></div>

        <div class="main-content">

            <div class="page-header">
                <h1>✏️ Update Student</h1>
            </div>

            <div class="form-card">

                <form th:action="@{'/teacher/student-update'}" th:object="${studentDto}" method="post" novalidate>

                    <div class="form-grid">
                        <input type="hidden" th:field="*{id}">


                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" th:field="*{name}" required>
                            <p class="hasError" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                        </div>

                        <div class="form-group">
                            <label>Roll No</label>
                            <input type="number" th:field="*{rollNo}" required>
                            <p class="hasError" th:if="${#fields.hasErrors('rollNo')}" th:errors="*{rollNo}"></p>
                        </div>

                        <div class="form-group">
                            <label>Course</label>
                            <input type="text" required th:field="*{course}">
                            <p class="hasError" th:if="${#fields.hasErrors('course')}" th:errors="*{course}"></p>
                        </div>

                        <div class="form-group">
                            <label>Class</label>
                            <input type="text" required th:field="*{classroom}">
                            <p class="hasError" th:if="${#fields.hasErrors('classroom')}" th:errors="*{classroom}"></p>
                        </div>

                        <div class="form-group">
                            <label>Department</label>
                            <input type="text" required th:field="*{department}" readonly>
                            <p class="hasError" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></p>
                        </div>

                        <div class="form-group">
                            <label>Mobile</label>
                            <input type="number" required th:field="*{contact}">
                            <p class="hasError" th:if="${#fields.hasErrors('contact')}" th:errors="*{contact}"></p>
                        </div>

                    </div>

                    <div class="form-actions">
                        <div class="button1">
                            <button type="submit" class="save-btn">Update Student</button>
                            <a th:href="@{/teacher/all-students}" class="cancel-btn">Cancel</a>
                        </div>
                        <div class="buttom2">
                            <a th:href="@{'/teacher/student-face-update/'+${id}}" class="face-btn">Update Face</a>
                        </div>
                    </div>
                    
                </form>

            </div>  

        </div>
        <style>

            .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            color: white;
            border-radius: 6px;
            font-size: 15px;
            z-index: 9999;
            animation: slide 0.4s ease;
        }

        .success {
            background: #16a34a;
        }

        .error {
            background: #dc2626;
        }
            .main-content {
                margin-left: 180px;
                margin-top: 50px;
                padding: 25px;
            }

            .page-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 20px;
            }

            .page-header h1 {
                font-size: 26px;
            }

            .hasError {
                color: red;
                font-size: small;
            }

            .back-btn {
                background: #1668ec;
                color: white;
                padding: 7px 14px;
                border-radius: 6px;
                text-decoration: none;
                font-size: 14px;
            }

            .back-btn:hover {
                background: #0f4fc4;
            }

            .form-card {
                background: white;
                padding: 25px;
                border-radius: 12px;
                box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            }

            .form-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .form-group {
                display: flex;
                flex-direction: column;
            }

            .form-group label {
                font-size: 14px;
                margin-bottom: 5px;
                color: #555;
            }

            .form-group input,
            .form-group select {
                padding: 10px;
                border-radius: 8px;
                border: 1px solid #ccc;
            }

            .form-actions {
                margin-top: 20px;
                display: flex;
                justify-content: space-between; /* left & right separation */
                align-items: center;
            }

            .button1 {
                display: flex;
                align-items: center;
            }

            .buttom2 {
                display: flex;
                justify-content: flex-end;
            }

            .save-btn {
                background: #16a34a;
                color: white;
                padding: 10px 18px;
                border-radius: 8px;
                border: none;
                cursor: pointer;
            }

            .save-btn:hover {
                background: #15803d;
            }

            .face-btn {
                background: #c12525;
                color: white;
                padding: 6px 18px;
                border-radius: 8px;
                border: none;
                cursor: pointer;
            }

            .face-btn:hover {
                background: #971b1b;
            }

            .cancel-btn {
                margin-left: 10px;
                text-decoration: none;
                color: #dc2626;
            }

            @media(max-width: 768px) {

                .form-grid {
                    grid-template-columns: 1fr;
                }

                .main-content {
                    margin-left: 150px;
                }
            }
        </style>
    </div>                                                                      
</body>
</html>
