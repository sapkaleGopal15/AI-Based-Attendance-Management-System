<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page Not Found</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#f5f7fa;
        }

        .container{
            text-align:center;
        }

        h1{
            font-size:120px;
            color:#2563eb;
        }

        h2{
            font-size:35px;
            margin-bottom:15px;
            color:#111827;
        }

        p{
            color:#6b7280;
            margin-bottom:30px;
            font-size:18px;
        }

        a{
            text-decoration:none;
            background:#2563eb;
            color:white;
            padding:12px 25px;
            border-radius:8px;
            transition:0.3s;
        }

        a:hover{
            background:#1d4ed8;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>404</h1>

    <h2>Page Not Found</h2>

    <p>
        Sorry, the page you are looking for does not exist.
    </p>

    <a href="/">Go To Home</a>

</div>

</body>
</html>
